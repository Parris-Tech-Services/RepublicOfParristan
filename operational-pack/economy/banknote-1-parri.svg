<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <title>One Parri banknote</title>
  <rect x="4" y="4" width="592" height="272" rx="16" fill="#F4DC94" stroke="#7A5A12" stroke-width="6"/>
  <rect x="20" y="20" width="560" height="240" rx="10" fill="none" stroke="#B5502A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="70" font-family="Georgia, serif" font-size="22" fill="#7A5A12" letter-spacing="3">REPUBLIC OF PARRISTAN</text>
  <text x="40" y="96" font-family="Georgia, serif" font-size="13" fill="#7A5A12">TREASURY NOTE · LEGAL TENDER FOR ONE SAUSAGE SIZZLE</text>
  <!-- Rain gauge portrait -->
  <rect x="270" y="115" width="60" height="120" rx="10" fill="#FFFFFF" stroke="#3B2A10" stroke-width="4"/>
  <rect x="277" y="175" width="46" height="54" fill="#5BA4D9"/>
  <g stroke="#3B2A10" stroke-width="2">
    <line x1="270" y1="140" x2="285" y2="140"/><line x1="270" y1="160" x2="285" y2="160"/>
    <line x1="270" y1="180" x2="285" y2="180"/><line x1="270" y1="200" x2="285" y2="200"/>
  </g>
  <!-- Value -->
  <text x="540" y="90" font-family="Georgia, serif" font-size="64" font-weight="bold" text-anchor="end" fill="#B5502A">1</text>
  <text x="70" y="240" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#B5502A">₱R 1</text>
  <text x="540" y="225" font-family="Georgia, serif" font-size="14" text-anchor="end" fill="#3B2A10">ONE PARRI</text>
  <!-- Treasurer signature line -->
  <line x1="390" y1="190" x2="540" y2="190" stroke="#3B2A10" stroke-width="1.5"/>
  <text x="465" y="205" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3B2A10">TREASURER</text>
  <text x="300" y="262" font-family="Courier New, monospace" font-size="11" text-anchor="middle" fill="#7A5A12">SERIAL PRS-000001</text>
</svg>
