<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Flag of the Republic of Parristan</title>
  <!-- Upper field: red dirt -->
  <rect x="0" y="0" width="900" height="300" fill="#B5502A"/>
  <!-- Lower field: wheat gold -->
  <rect x="0" y="300" width="900" height="300" fill="#E2B13C"/>
  <!-- Horizon line: the long straight road -->
  <rect x="0" y="292" width="900" height="16" fill="#FFFFFF"/>
  <!-- Rising sun on the horizon -->
  <path d="M 370 300 A 80 80 0 0 1 530 300 Z" fill="#FFF4D6"/>
  <g stroke="#FFF4D6" stroke-width="8" stroke-linecap="round">
    <line x1="450" y1="200" x2="450" y2="170"/>
    <line x1="385" y1="225" x2="365" y2="203"/>
    <line x1="515" y1="225" x2="535" y2="203"/>
    <line x1="350" y1="270" x2="322" y2="258"/>
    <line x1="550" y1="270" x2="578" y2="258"/>
  </g>
  <!-- The Indicator: canton light, left side only (in honour of the Minister for Infrastructure) -->
  <circle cx="90" cy="90" r="42" fill="#FFFFFF"/>
  <circle cx="90" cy="90" r="26" fill="#F28C1E"/>
  <!-- Five wheat stalks: the five founders -->
  <g stroke="#7A5A12" stroke-width="6" fill="#7A5A12">
    <line x1="330" y1="560" x2="330" y2="430"/><ellipse cx="330" cy="420" rx="10" ry="26"/>
    <line x1="390" y1="560" x2="390" y2="420"/><ellipse cx="390" cy="410" rx="10" ry="26"/>
    <line x1="450" y1="560" x2="450" y2="405"/><ellipse cx="450" cy="395" rx="10" ry="26"/>
    <line x1="510" y1="560" x2="510" y2="420"/><ellipse cx="510" cy="410" rx="10" ry="26"/>
    <line x1="570" y1="560" x2="570" y2="430"/><ellipse cx="570" cy="420" rx="10" ry="26"/>
  </g>
</svg>
