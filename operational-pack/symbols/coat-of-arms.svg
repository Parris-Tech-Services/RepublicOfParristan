<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <title>Coat of Arms of the Republic of Parristan</title>
  <!-- Shield -->
  <path d="M 150 120 L 450 120 L 450 360 Q 450 500 300 570 Q 150 500 150 360 Z" fill="#E2B13C" stroke="#3B2A10" stroke-width="8"/>
  <!-- Chief: red dirt band -->
  <path d="M 150 120 L 450 120 L 450 220 L 150 220 Z" fill="#B5502A"/>
  <!-- Crossed spanner and shepherd's crook -->
  <g stroke="#3B2A10" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="215" y1="460" x2="385" y2="270"/>
    <line x1="385" y1="460" x2="225" y2="280"/>
    <path d="M 225 280 Q 200 250 225 235 Q 250 225 255 250"/>
  </g>
  <circle cx="392" cy="262" r="22" fill="none" stroke="#3B2A10" stroke-width="12"/>
  <rect x="384" y="236" width="16" height="22" fill="#B5502A"/>
  <!-- Rain gauge in the chief -->
  <rect x="285" y="138" width="30" height="64" rx="6" fill="#FFFFFF" stroke="#3B2A10" stroke-width="4"/>
  <rect x="289" y="170" width="22" height="28" fill="#5BA4D9"/>
  <!-- Supporters: two galahs, stylised -->
  <g fill="#E8A0B4" stroke="#3B2A10" stroke-width="4">
    <ellipse cx="105" cy="300" rx="40" ry="70"/>
    <circle cx="110" cy="215" r="28"/>
    <ellipse cx="495" cy="300" rx="40" ry="70"/>
    <circle cx="490" cy="215" r="28"/>
  </g>
  <g fill="#9AA0A6" stroke="#3B2A10" stroke-width="4">
    <ellipse cx="90" cy="320" rx="22" ry="50"/>
    <ellipse cx="510" cy="320" rx="22" ry="50"/>
  </g>
  <!-- Crest: sausage on a fork -->
  <rect x="295" y="40" width="10" height="70" fill="#3B2A10"/>
  <rect x="255" y="40" width="90" height="26" rx="13" fill="#8B3A1E" stroke="#3B2A10" stroke-width="4"/>
  <!-- Motto scroll -->
  <path d="M 90 600 Q 300 650 510 600 L 510 650 Q 300 700 90 650 Z" fill="#FFF4D6" stroke="#3B2A10" stroke-width="5"/>
  <text x="300" y="648" font-family="Georgia, serif" font-size="22" text-anchor="middle" fill="#3B2A10">FORTUNA FAVET FORTIBUS FIXORIBUS</text>
</svg>
