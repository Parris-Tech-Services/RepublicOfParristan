name: Validate Private Voting
on:
  pull_request:
    paths:
      - 'apps/private-voting/**'
      - '.github/workflows/test-private-voting.yml'
  push:
    branches: [main]
    paths:
      - 'apps/private-voting/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/private-voting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit
      - run: npm test
      - run: node --check api/index.js
      - run: node --check public/app.js
