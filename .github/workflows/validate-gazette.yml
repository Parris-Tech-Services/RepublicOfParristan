name: Validate Public Gazette
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Gazette
        uses: actions/checkout@v4
      - name: Validate Gazette, web pages and source links
        run: python3 scripts/validate_gazette.py
