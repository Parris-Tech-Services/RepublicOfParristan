name: Validate Parristan National Operations
on:
  pull_request:
    paths:
      - NATIONAL_OPERATIONS_TODO.md
      - 'operations/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/validate-national-operations.yml'
      - 'docs/FOUNDERS.md'
      - 'docs/data/**'
      - 'docs/administration.html'
      - 'docs/decisions.html'
      - 'institutions/DECISION_REGISTER.md'
      - 'scripts/validate_public_records.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the offline citizenship register
        run: python -m unittest discover -s tests -v
      - name: Validate public decisions and administration records
        run: python3 scripts/validate_public_records.py
      - name: Compile tooling
        run: python -m py_compile tools/parristan_registry.py
